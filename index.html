<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Una experiencia interactiva de flores">
    <title>Flores para ti</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Cat Intro Screen ("hola runita") -->
    <div id="cat-intro-screen" class="screen active">
        <div class="cat-intro-content">
            <div class="petal petal-1" aria-hidden="true"></div>
            <div class="petal petal-2" aria-hidden="true"></div>
            <div class="petal petal-3" aria-hidden="true"></div>
            <div class="petal petal-4" aria-hidden="true"></div>

            <div class="cat-dialogue-bubble">
                <span class="bubble-text">hola runita</span>
                <span class="bubble-tail"></span>
            </div>

            <div class="cat-gif-wrapper">
                <img src="assets/images/gato saluda.gif" alt="Gato saludando" class="cat-saluda-gif">
            </div>

            <button id="cat-continue-btn" class="open-button cat-continue-btn" aria-label="Continuar">
                <span>Continuar 🐾</span>
            </button>
        </div>
    </div>

    <div id="welcome-screen" class="screen">
        <div class="welcome-content">
            <div class="petal petal-1" aria-hidden="true"></div>
            <div class="petal petal-2" aria-hidden="true"></div>
            <div class="petal petal-3" aria-hidden="true"></div>
            <div class="petal petal-4" aria-hidden="true"></div>
            <h1 class="welcome-title">
            🌊🌊🌊 ¡Ooolaaa, <strong>Anahí</strong>!<br>
            Aquí hay flores amarillas.
            </h1>
            <p class="welcome-subtitle">con una canción especial</p>
            <button id="open-btn" class="open-button" aria-label="Abrir experiencia">
                <span>Abrir</span>
            </button>
        </div>
    </div>

    <div id="experience-screen" class="screen">
        <div id="petal-layer" aria-hidden="true"></div>
        
        <!-- Interactive Canvas Background with Dancing Sunflowers -->
        <canvas id="flower-canvas" aria-label="Girasoles amarillos bailarines"></canvas>

        <!-- Dynamic Lyrics Overlay (Apple Music style) with pointer-events: none -->
        <div id="apple-lyrics-container" class="apple-lyrics-container hidden" aria-live="polite">
            <div class="lyrics-header">
                <span class="lyrics-track-kicker">El Tesoro • El Mató a un Policía Motorizado</span>
            </div>
            <div id="lyrics-scroll" class="lyrics-scroll">
                <!-- Dynamically populated lines -->
            </div>
        </div>

        <!-- Floating Glassmorphism Notification -->
        <div id="interactive-hint" class="interactive-hint hidden" aria-live="polite">
            <span class="hint-icon">🌻</span>
            <span class="hint-text">Toca y arrastra las flores al ritmo de la música</span>
        </div>

        <!-- Minimalist Floating Bottom Bar -->
        <div id="audio-bar" class="audio-bar hidden" role="region" aria-label="Control de reproducción">
            <button id="audio-toggle" class="audio-btn" aria-label="Pausar música">
                <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
                    <rect x="6" y="4" width="4" height="16" rx="1"/>
                    <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
                <svg class="icon-play hidden" viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
                    <polygon points="5,3 19,12 5,21"/>
                </svg>
            </button>

            <div class="track-progress-container">
                <span id="time-current" class="time-label">0:00</span>
                <div id="progress-bar-bg" class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
                <span id="time-total" class="time-label">0:00</span>
            </div>

            <button id="audio-mute" class="audio-btn" aria-label="Silenciar música">
                <svg class="icon-unmuted" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg class="icon-muted hidden" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>

            <button id="lyrics-toggle" class="audio-btn lyrics-toggle-btn active" aria-label="Mostrar u ocultar letra" title="Mostrar u ocultar letra">
                <svg class="icon-lyrics" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
                    <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-9 9H7V7h4v4zm6 0h-4V7h4v4z"/>
                </svg>
            </button>

            <a id="youtube-link" class="youtube-icon-btn" href="https://www.youtube.com/watch?v=vlneT-a-KkQ&list=RDvlneT-a-KkQ&start_radio=1" target="_blank" rel="noopener noreferrer" aria-label="Escuchar en YouTube" title="Escuchar en YouTube">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            </a>
        </div>
    </div>

    <script src="js/lyrics-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
